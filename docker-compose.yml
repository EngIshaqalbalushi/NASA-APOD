services:
  apod-explorer:
    build: .
    container_name: nasa-apod-explorer
    ports:
      - "8081:8080"
    environment:
      - NASA_API_KEY=${NASA_API_KEY:-BnJVPiHXWagRnLcEo6PqC4h0wwpFS6Zr8YvrQqKt}
      - NASA_API_BASE_URL=https://api.nasa.gov/planetary/apod
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    restart: unless-stopped

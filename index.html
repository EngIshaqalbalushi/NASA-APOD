<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NASA APOD Explorer</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  body { background: #000; color: #e5e2e1; overflow-x: hidden; font-family: Inter, sans-serif; }
  .glass-panel { background: rgba(11,13,23,0.4); backdrop-filter: blur(20px); border-top: 1px solid rgba(255,255,255,0.1); border-left: 1px solid rgba(255,255,255,0.1); }
  .starfield { position: fixed; inset: 0; background-image: radial-gradient(1px 1px at 20px 30px,#fff,rgba(0,0,0,0)),radial-gradient(1px 1px at 40px 70px,#fff,rgba(0,0,0,0)),radial-gradient(2px 2px at 90px 40px,#fff,rgba(0,0,0,0)); background-repeat: repeat; background-size: 200px 200px; opacity: 0.15; z-index: -1; }
  .nav-link { font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #b9cacb; transition: color 0.3s; }
  .nav-link:hover, .nav-link.active { color: #dbfcff; }
  .nav-link.active { font-weight: 700; border-bottom: 2px solid #dbfcff; }
</style>
</head>
<body>
<div class="starfield"></div>

<header class="fixed top-0 w-full z-50 bg-[#131313]/40 backdrop-blur-xl border-b border-[#3b494b]/20">
  <nav class="flex justify-between items-center px-5 md:px-16 py-4 max-w-[1440px] mx-auto">
    <div class="font-['Space_Grotesk'] text-2xl md:text-3xl font-semibold tracking-tighter text-[#dbfcff]">NASA APOD</div>
    <div class="hidden md:flex gap-8">
      <a class="nav-link active" href="index.html">Home</a>
      <a class="nav-link" href="#">Gallery</a>
      <a class="nav-link" href="#">About</a>
      <a class="nav-link" href="#">Community</a>
      <a class="nav-link" href="#">API</a>
    </div>
  </nav>
</header>

<main class="relative">
  <section class="relative min-h-screen flex items-end pt-32 pb-20 px-5 md:px-16 overflow-hidden">
    <div class="absolute inset-0 -z-10">
      <video id="bg-video" class="absolute inset-0 w-full h-full object-cover" autoplay muted loop playsinline></video>
      <img id="hero-image" class="absolute inset-0 w-full h-full object-cover" src="" style="display:none"/>
      <div class="absolute inset-0 bg-gradient-to-t from-black via-black/20 to-transparent"></div>
      <div class="absolute inset-0 bg-black/40"></div>
    </div>
    <div class="max-w-4xl w-full">
      <div class="glass-panel p-8 md:p-12 rounded-xl">
        <div class="mb-6">
          <span id="apod-badge" class="font-['JetBrains_Mono'] text-[12px] text-[#dbfcff] tracking-widest bg-[#dbfcff]/10 px-3 py-1 rounded-full">ASTRONOMY PICTURE OF THE DAY</span>
          <h2 id="apod-date" class="font-['JetBrains_Mono'] text-[14px] text-[#b9cacb] mt-4 opacity-70"></h2>
        </div>
        <h1 id="apod-title" class="font-['Space_Grotesk'] text-4xl md:text-7xl font-bold text-[#e5e2e1] mb-6 leading-tight"></h1>
        <p id="apod-explanation" class="font-['Inter'] text-[16px] text-[#b9cacb] max-w-2xl mb-8 leading-relaxed"></p>
        <div id="apod-tags" class="flex flex-wrap gap-3 mb-10"></div>
        <div class="flex flex-col sm:flex-row gap-4">
          <button id="view-fullres" class="bg-[#dbfcff] text-[#00363a] px-8 py-4 font-['JetBrains_Mono'] text-[12px] tracking-widest hover:brightness-110 transition-all flex items-center gap-2">VIEW FULL RESOLUTION <span class="material-symbols-outlined text-[18px]">arrow_outward</span></button>
          <button id="discover-yesterday" class="border border-[#dbfcff]/40 backdrop-blur-md text-[#dbfcff] px-8 py-4 font-['JetBrains_Mono'] text-[12px] tracking-widest hover:bg-[#dbfcff]/10 transition-all flex items-center gap-2">DISCOVER YESTERDAY <span class="material-symbols-outlined text-[18px]">history</span></button>
        </div>
      </div>
    </div>
  </section>

  <footer class="w-full border-t border-[#3b494b]/10 bg-[#0e0e0e]/80 backdrop-blur-md">
    <div class="px-5 md:px-16 py-12 max-w-[1440px] mx-auto text-center text-[#b9cacb] text-sm">
      Astronomy Picture of the Day is a service of NASA. Data provided by <a class="text-[#dbfcff] hover:underline" href="https://api.nasa.gov" target="_blank">api.nasa.gov</a>.
    </div>
  </footer>
</main>

<script>
const API_KEY = 'BnJVPiHXWagRnLcEo6PqC4h0wwpFS6Zr8YvrQqKt';
const BASE_URL = 'https://api.nasa.gov/planetary/apod';

function formatDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }).toUpperCase();
}

function extractTags(title, explanation) {
  const words = (title + ' ' + explanation).toUpperCase().split(/\s+/);
  const known = ['NEBULA','GALAXY','STAR','PLANET','MOON','SOLAR','ORION','MARS','JUPITER','SATURN','SUPERNOVA','CLUSTER','COMET','ASTEROID','BLACK','HOLE','QUASAR','PULSAR','HUBBLE','WEBB','SPACE','COSMOS','UNIVERSE','STELLAR','AURORA','ECLIPSE','MILKY','ANDROMEDA'];
  const found = new Set();
  for (const w of words) {
    const clean = w.replace(/[^A-Z0-9]/g, '');
    if (clean.length > 2 && known.some(k => k.includes(clean) || clean.includes(k))) found.add(clean);
  }
  return found.size > 0 ? [...found].slice(0,5) : ['COSMOS','NASA','SPACE'];
}

async function fetchApod(date) {
  const params = new URLSearchParams({ api_key: API_KEY, thumbs: 'true' });
  if (date) params.set('date', date);
  const res = await fetch(`${BASE_URL}?${params}`);
  if (!res.ok) throw new Error('API error');
  return res.json();
}

async function loadApod(date) {
  try {
    const data = await fetchApod(date);
    const img = document.getElementById('hero-image');
    const video = document.getElementById('bg-video');
    const badge = document.getElementById('apod-badge');

    if (data.media_type === 'video') {
      badge.textContent = 'ASTRONOMY PICTURE OF THE DAY (VIDEO)';
      img.style.display = 'none';
      video.style.display = 'block';
      const src = document.createElement('source');
      src.src = data.url;
      src.type = 'video/mp4';
      video.innerHTML = '';
      video.appendChild(src);
      video.load(); video.play().catch(() => {});
      document.getElementById('view-fullres').onclick = () => window.open(data.url, '_blank');
    } else {
      badge.textContent = 'ASTRONOMY PICTURE OF THE DAY';
      video.style.display = 'none';
      img.style.display = 'block';
      img.src = data.hdurl || data.url;
      document.getElementById('view-fullres').onclick = () => window.open(data.hdurl || data.url, '_blank');
    }

    document.getElementById('apod-date').textContent = formatDate(data.date);
    document.getElementById('apod-title').textContent = data.title;
    document.getElementById('apod-explanation').textContent = data.explanation;

    const tagsContainer = document.getElementById('apod-tags');
    tagsContainer.innerHTML = '';
    extractTags(data.title, data.explanation).forEach(t => {
      const span = document.createElement('span');
      span.className = 'px-4 py-1.5 glass-panel rounded-full text-[#e1b6ff] font-[\'JetBrains_Mono\'] text-[12px] border border-[#e1b6ff]/30 hover:border-[#e1b6ff] transition-all cursor-pointer';
      span.textContent = '#' + t;
      tagsContainer.appendChild(span);
    });

    document.getElementById('discover-yesterday').onclick = () => {
      const y = new Date(); y.setDate(y.getDate() - 1);
      loadApod(y.toISOString().split('T')[0]);
    };
  } catch (err) {
    document.getElementById('apod-title').textContent = 'Failed to load APOD';
    document.getElementById('apod-explanation').textContent = 'Check your internet connection or API key.';
    console.error(err);
  }
}

loadApod();
</script>
</body>
</html>
